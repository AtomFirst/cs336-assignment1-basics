model:
  vocab_size: 10000
  context_length: 256
  d_model: 256
  num_layers: 8
  num_heads: 8
  d_ff: 1024
  rope_theta: 10000.0

optimizer:
  betas: [0.9, 0.999]

lr_schedule:
  max_learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  warmup_iters: 2000
  cosine_cycle_iters: 600000

datasets:
  train: "../data/TinyStoriesV2-GPT4-train.bin"
  vaild: "../data/TinyStoriesV2-GPT4-valid.bin"

train:
  batch_size: 32
  device: "cuda"

checkpoint:
  path: "last.pt"