model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  betas: [0.9, 0.999]

lr_schedule:
  max_learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  warmup_iters: 2000
  cosine_cycle_iters: 600000

datasets:
  train: "./data/TinyStoriesV2-GPT4-train.bin"
  valid: "./data/TinyStoriesV2-GPT4-valid.bin"

train:
  epochs: 20000
  batch_size: 64
  saving_per_epochs: 100

device: "cuda"

checkpoint:
  path: "./checkpoints/std-last.pt"